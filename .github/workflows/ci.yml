name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Syntax-check JavaScript files
        run: |
          node --check tools/corpus-hub-site/test_hub_usage_rate.mjs
          cp functions/_lib/hub-usage.js /tmp/hub-usage-check.mjs
          node --check /tmp/hub-usage-check.mjs
      - name: Verify patch record and repository assets
        run: node tools/check_repo.mjs
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run the IPv6 /64 rate-limit regression suite
        run: node --test tools/corpus-hub-site/test_hub_usage_rate.mjs
